<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Forever Person of My Life</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

    :root {
      --bg-dark: #08040d;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);

      /* All Colors Rainbow Spectrum Layers */
      --c-l1: #ff0055; /* Rose Red */
      --c-l2: #ff5400; /* Warm Amber */
      --c-l3: #ffbd00; /* Golden Sun */
      --c-l4: #00f0a8; /* Emerald Mint */
      --c-l5: #00d2ff; /* Sky Cyan */
      --c-l6: #9d4edd; /* Electric Violet */
      --c-l7: #ff70a6; /* Neon Pink */

      --glow-color: rgba(255, 0, 110, 0.55);
      --core-fill-1: #ff1b6b;
      --core-fill-2: #5b0024;
    }

    /* Color Themes */
    body.theme-crimson {
      --c-l1: #ff0055;
      --c-l2: #ff2a6d;
      --c-l3: #ff477e;
      --c-l4: #ff5c8a;
      --c-l5: #ff7096;
      --c-l6: #ff85a1;
      --c-l7: #ff99ac;
      --glow-color: rgba(255, 42, 109, 0.6);
      --core-fill-1: #ff2a6d;
      --core-fill-2: #4a0018;
    }

    body.theme-sunset {
      --c-l1: #ff3c00;
      --c-l2: #ff6200;
      --c-l3: #ff8800;
      --c-l4: #ffae00;
      --c-l5: #ffd000;
      --c-l6: #ffe600;
      --c-l7: #fff3b0;
      --glow-color: rgba(255, 98, 0, 0.6);
      --core-fill-1: #ff6200;
      --core-fill-2: #501500;
    }

    body.theme-cosmic {
      --c-l1: #7928ca;
      --c-l2: #9d4edd;
      --c-l3: #b5179e;
      --c-l4: #c77dff;
      --c-l5: #00b4d8;
      --c-l6: #48cae4;
      --c-l7: #caf0f8;
      --glow-color: rgba(181, 23, 158, 0.6);
      --core-fill-1: #9d4edd;
      --core-fill-2: #240046;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b0a2a 0%, var(--bg-dark) 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      perspective: 1000px;
      user-select: none;
      transition: background 0.6s ease;
    }

    /* Floating stars and love dust canvas */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      width: 100%;
      max-width: 600px;
    }

    /* Romantic Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 22px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0055, #ffbd00);
      box-shadow: 0 0 10px #ff0055;
      animation: heartBlink 1.2s infinite;
    }

    @keyframes heartBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* 3D Heart Parallax Wrapper */
    .heart-card-3d {
      position: relative;
      width: min(88vw, 420px);
      height: min(88vw, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      cursor: pointer;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 28px var(--glow-color));
      transform-style: preserve-3d;
      transition: filter 0.5s ease;
    }

    svg.beating {
      animation: heartbeatPulse 1.4s ease-in-out infinite;
    }

    .heart-layer-group {
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .heart-layer {
      fill: transparent;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: fill 1s ease, stroke 0.4s ease;
    }

    /* 7 Rainbow / Chromatic Layers */
    .layer-1 { stroke: var(--c-l1); stroke-width: 4.5; }
    .layer-2 { stroke: var(--c-l2); stroke-width: 4.0; }
    .layer-3 { stroke: var(--c-l3); stroke-width: 3.5; }
    .layer-4 { stroke: var(--c-l4); stroke-width: 3.0; }
    .layer-5 { stroke: var(--c-l5); stroke-width: 2.6; }
    .layer-6 { stroke: var(--c-l6); stroke-width: 2.2; }
    .layer-7 { stroke: var(--c-l7); stroke-width: 1.8; }

    @keyframes heartbeatPulse {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.09); filter: drop-shadow(0 0 45px var(--glow-color)); }
      28% { transform: scale(1.02); }
      42% { transform: scale(1.14); filter: drop-shadow(0 0 60px var(--glow-color)); }
      70% { transform: scale(1); filter: drop-shadow(0 0 28px var(--glow-color)); }
    }

    /* Center Dedication Text Overlay */
    .forever-dedication {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      padding: 0 20px;
    }

    .forever-dedication.visible {
      opacity: 1;
      transform: scale(1);
    }

    .dedication-subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    }

    .dedication-title {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      line-height: 1.25;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 30px var(--glow-color);
    }

    .dedication-note {
      font-size: 12px;
      color: #ffd0dc;
      letter-spacing: 1.5px;
      margin-top: 6px;
      font-weight: 400;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
    }

    /* Controls Bar */
    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 999px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff0055, #ff5400);
      border: none;
      box-shadow: 0 4px 16px rgba(255, 0, 85, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 22px rgba(255, 84, 0, 0.6);
    }

    .btn-active {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      padding: 0 4px;
    }

    .slider-wrap input {
      accent-color: #ff0055;
      cursor: pointer;
      width: 70px;
    }

    /* Personalize Input Bar */
    .custom-name-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 440px;
    }

    .name-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      outline: none;
      backdrop-filter: blur(12px);
      text-align: center;
      letter-spacing: 0.5px;
    }

    .name-input:focus {
      border-color: #ff0055;
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.4);
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <main class="stage">
    <!-- Live Status Label -->
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Drawing Layer 1 / 7</span>
    </div>

    <!-- 3D Layered Heart Stage -->
    <div class="heart-card-3d" id="card3d" title="Click to burst love stardust!">
      <svg viewBox="-60 -40 320 300" id="heartSvg">
        <defs>
          <!-- Glowing Core Gradient -->
          <radialGradient id="heartCoreGrad" cx="50%" cy="38%" r="65%">
            <stop offset="0%" stop-color="var(--core-fill-1)" />
            <stop offset="60%" stop-color="#b5003f" />
            <stop offset="100%" stop-color="var(--core-fill-2)" />
          </radialGradient>
        </defs>

        <!-- Layer 7 (Outermost Aura: Deep Violet/Rose Glow) -->
        <g class="heart-layer-group" data-z="10" transform="translate(100, 110) scale(1.42) translate(-100, -110)">
          <path class="heart-layer layer-7" d="M100,30 C70,-15 0,0 0,65 C0,125 75,170 100,200 C125,170 200,125 200,65 C200,0 130,-15 100,30 Z" />
        </g>

        <!-- Layer 6 (Sky Cyan) -->
        <g class="heart-layer-group" data-z="20" transform="translate(100, 110) scale(1.35) translate(-100, -110)">
          <path class="heart-layer layer-6" d="M100,30 C70,-15 0,0 0,65 C0,125 75,170 100,200 C125,170 200,125 200,65 C200,0 130,-15 100,30 Z" />
        </g>

        <!-- Layer 5 (Emerald Mint) -->
        <g class="heart-layer-group" data-z="30" transform="translate(100, 110) scale(1.28) translate(-100, -110)">
          <path class="heart-layer layer-5" d="M100,30 C70,-15 0,0 0,65 C0,125 75,170 100,200 C125,170 200,125 200,65 C200,0 130,-15 100,30 Z" />
        </g>

        <!-- Layer 4 (Golden Sun) -->
        <g class="heart-layer-group" data-z="40" transform="translate(100, 110) scale(1.21) translate(-100, -110)">
          <path class="heart-layer layer-4" d="M100,30 C70,-15 0,0 0,65 C0,125 75,170 100,200 C125,170 200,125 200,65 C200,0 130,-15 100,30 Z" />
        </g>

        <!-- Layer 3 (Warm Amber) -->
        <g class="heart-layer-group" data-z="50" transform="translate(100, 110) scale(1.14) translate(-100, -110)">
          <path class="heart-layer layer-3" d="M100,30 C70,-15 0,0 0,65 C0,125 75,170 100,200 C125,170 200,125 200,65 C200,0 130,-15 100,30 Z" />
        </g>

        <!-- Layer 2 (Coral Rose) -->
        <g class="heart-layer-group" data-z="60" transform="translate(100, 110) scale(1.07) translate(-100, -110)">
          <path class="heart-layer layer-2" d="M100,30 C70,-15 0,0 0,65 C0,125 75,170 100,200 C125,170 200,125 200,65 C200,0 130,-15 100,30 Z" />
        </g>

        <!-- Layer 1 (Crimson Red Core) -->
        <g class="heart-layer-group" data-z="70" transform="translate(100, 110) scale(1.00) translate(-100, -110)">
          <path class="heart-layer layer-1" d="M100,30 C70,-15 0,0 0,65 C0,125 75,170 100,200 C125,170 200,125 200,65 C200,0 130,-15 100,30 Z" />
        </g>
      </svg>

      <!-- Forever Person Dedication Overlay -->
      <div class="forever-dedication" id="foreverDedication">
        <span class="dedication-subtitle">To You</span>
        <h2 class="dedication-title" id="titleText">The Forever Person</h2>
        <span class="dedication-note" id="subNoteText">of My Life</span>
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <button class="btn btn-primary" id="replayBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>
        Replay Love
      </button>

      <button class="btn" id="soundBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span id="soundLabel">Heartbeat: Off</span>
      </button>

      <select id="soundTypeSelect" class="btn" style="padding: 6px 10px; cursor: pointer; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); outline: none;">
        <option value="realistic" style="background: #180e28; color: #fff;">Deep Thump</option>
        <option value="romantic" style="background: #180e28; color: #fff;">Soft Mellow</option>
        <option value="cyber" style="background: #180e28; color: #fff;">Cyber Synth</option>
      </select>

      <button class="btn" id="themeBtn">Colors</button>

      <div class="slider-wrap">
        <span>Speed</span>
        <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.25" value="1" />
      </div>
    </div>

    <!-- Personalization Input -->
    <div class="custom-name-bar">
      <input
        type="text"
        id="nameInput"
        class="name-input"
        placeholder="Type dedication (e.g. For Sarah • My Forever Person)..."
        value="The Forever Person of My Life"
        maxlength="35"
      />
      <button class="btn" id="updateNameBtn">Dedicate</button>
    </div>
  </main>

  <script>
    const svg = document.getElementById('heartSvg');
    const card3d = document.getElementById('card3d');
    const statusText = document.getElementById('statusText');
    const replayBtn = document.getElementById('replayBtn');
    const soundBtn = document.getElementById('soundBtn');
    const soundLabel = document.getElementById('soundLabel');
    const soundTypeSelect = document.getElementById('soundTypeSelect');
    const themeBtn = document.getElementById('themeBtn');
    const speedSlider = document.getElementById('speedSlider');
    const foreverDedication = document.getElementById('foreverDedication');
    const titleText = document.getElementById('titleText');
    const subNoteText = document.getElementById('subNoteText');
    const nameInput = document.getElementById('nameInput');
    const updateNameBtn = document.getElementById('updateNameBtn');

    const layerGroups = document.querySelectorAll('.heart-layer-group');
    const layers = [
      document.querySelector('.layer-1'),
      document.querySelector('.layer-2'),
      document.querySelector('.layer-3'),
      document.querySelector('.layer-4'),
      document.querySelector('.layer-5'),
      document.querySelector('.layer-6'),
      document.querySelector('.layer-7')
    ];

    let animationSpeed = 1;
    let currentAnimId = null;
    let audioEnabled = false;
    let audioCtx = null;
    let beatTimer = null;

    // Web Audio Synthesized Heartbeat
    function playHeartbeatSound() {
      if (!audioEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const type = soundTypeSelect.value;
      const now = audioCtx.currentTime;

      if (type === 'realistic') {
        function triggerPulse(time, startF, endF, dur, vol) {
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(110, time);
          filter.Q.setValueAtTime(2.5, time);

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(startF, time);
          osc.frequency.exponentialRampToValueAtTime(endF, time + dur);
          gain.gain.setValueAtTime(vol, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          const click = audioCtx.createOscillator();
          const clickGain = audioCtx.createGain();
          click.type = 'triangle';
          click.frequency.setValueAtTime(startF * 1.5, time);
          clickGain.gain.setValueAtTime(vol * 0.4, time);
          clickGain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

          osc.connect(gain);
          click.connect(clickGain);
          gain.connect(filter);
          clickGain.connect(filter);
          filter.connect(audioCtx.destination);

          osc.start(time);
          osc.stop(time + dur);
          click.start(time);
          click.stop(time + 0.05);
        }
        triggerPulse(now, 58, 28, 0.14, 0.9);
        triggerPulse(now + 0.24, 72, 34, 0.12, 1.0);
      } else if (type === 'romantic') {
        function warmTone(time, freq, dur, vol) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);
          gain.gain.setValueAtTime(0, time);
          gain.gain.linearRampToValueAtTime(vol, time + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(time);
          osc.stop(time + dur);
        }
        warmTone(now, 110, 0.28, 0.45);
        warmTone(now + 0.25, 146.83, 0.22, 0.55);
      } else {
        function cyberDrop(time, startF, endF, dur) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(320, time);
          filter.frequency.exponentialRampToValueAtTime(40, time + dur);
          osc.frequency.setValueAtTime(startF, time);
          osc.frequency.exponentialRampToValueAtTime(endF, time + dur);
          gain.gain.setValueAtTime(0.35, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(time);
          osc.stop(time + dur);
        }
        cyberDrop(now, 160, 40, 0.16);
        cyberDrop(now + 0.24, 220, 50, 0.14);
      }
    }

    soundBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      soundBtn.classList.toggle('btn-active', audioEnabled);
      soundLabel.textContent = `Heartbeat: ${audioEnabled ? 'On' : 'Off'}`;
      if (audioEnabled) playHeartbeatSound();
    });

    // 3D Parallax on Mouse Move
    window.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;

      card3d.style.transform = `rotateY(${dx * 18}deg) rotateX(${-dy * 18}deg)`;

      layerGroups.forEach(g => {
        const z = parseFloat(g.dataset.z) || 20;
        const scaleVal = g.getAttribute('transform').match(/scale\(([^)]+)\)/)[1];
        g.style.transform = `translate3d(${dx * z * 0.4}px, ${dy * z * 0.4}px, ${z}px) translate(100px, 110px) scale(${scaleVal}) translate(-100px, -110px)`;
      });
    });

    window.addEventListener('mouseleave', () => {
      card3d.style.transform = `rotateY(0deg) rotateX(0deg)`;
      layerGroups.forEach(g => {
        const scaleVal = g.getAttribute('transform').match(/scale\(([^)]+)\)/)[1];
        g.style.transform = `translate3d(0, 0, 0) translate(100px, 110px) scale(${scaleVal}) translate(-100px, -110px)`;
      });
    });

    // Stroke lengths initialization
    layers.forEach(layer => {
      const len = layer.getTotalLength();
      layer.style.strokeDasharray = len;
      layer.style.strokeDashoffset = len;
    });

    // Layer-by-layer drawing sequence
    function startDrawingSequence() {
      if (currentAnimId) cancelAnimationFrame(currentAnimId);
      if (beatTimer) clearInterval(beatTimer);
      svg.classList.remove('beating');
      foreverDedication.classList.remove('visible');

      layers.forEach(l => {
        const len = l.getTotalLength();
        l.style.opacity = '0';
        l.style.fill = 'transparent';
        l.style.strokeDashoffset = len;
      });

      let currentLayerIndex = 0;
      let startTimestamp = null;
      const baseDuration = 650; // ms per layer

      function step(now) {
        if (!startTimestamp) startTimestamp = now;
        const elapsed = (now - startTimestamp) * animationSpeed;
        const progress = Math.min(elapsed / baseDuration, 1);

        const currentLayer = layers[currentLayerIndex];
        const len = currentLayer.getTotalLength();
        currentLayer.style.opacity = '1';
        currentLayer.style.strokeDashoffset = len * (1 - progress);

        statusText.textContent = `Drawing Layer ${currentLayerIndex + 1} / ${layers.length}`;

        if (progress < 1) {
          currentAnimId = requestAnimationFrame(step);
        } else {
          currentLayerIndex++;
          if (currentLayerIndex < layers.length) {
            startTimestamp = null;
            currentAnimId = requestAnimationFrame(step);
          } else {
            finishHeart();
          }
        }
      }

      currentAnimId = requestAnimationFrame(step);
    }

    function finishHeart() {
      layers[0].style.fill = 'url(#heartCoreGrad)';
      svg.classList.add('beating');
      statusText.textContent = 'Forever Complete • Pulsing In Love';
      foreverDedication.classList.add('visible');

      burstStardust(window.innerWidth / 2, window.innerHeight / 2, 45);

      playHeartbeatSound();
      beatTimer = setInterval(playHeartbeatSound, 1400);
    }

    startDrawingSequence();
    replayBtn.addEventListener('click', startDrawingSequence);

    speedSlider.addEventListener('input', (e) => {
      animationSpeed = parseFloat(e.target.value);
    });

    // Color Theme Switcher (All Colors Rainbow -> Crimson Rose -> Sunset Amber -> Cosmic Violet)
    const themes = ['', 'theme-crimson', 'theme-sunset', 'theme-cosmic'];
    let themeIdx = 0;
    themeBtn.addEventListener('click', () => {
      themeIdx = (themeIdx + 1) % themes.length;
      document.body.className = themes[themeIdx];
    });

    // Custom Name / Dedication update
    function updateDedication() {
      const val = nameInput.value.trim();
      if (!val) return;
      if (val.toLowerCase().includes("forever person")) {
        titleText.textContent = "The Forever Person";
        subNoteText.textContent = "of My Life";
      } else {
        titleText.textContent = val;
        subNoteText.textContent = "My Forever Person";
      }
    }
    updateNameBtn.addEventListener('click', updateDedication);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') updateDedication();
    });

    // Background Canvas Particles (Floating Stardust & Mini Hearts)
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -(Math.random() * 0.5 + 0.15),
        size: Math.random() * 2 + 0.5,
        hue: Math.floor(Math.random() * 360),
        alpha: Math.random() * 0.5 + 0.2,
        isBurst: false
      });
    }

    function burstStardust(x, y, count = 30) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        const hue = Math.floor(Math.random() * 360);
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3.5 + 1.5,
          hue,
          alpha: 1,
          isBurst: true
        });
      }
    }

    card3d.addEventListener('click', (e) => {
      const rect = card3d.getBoundingClientRect();
      burstStardust(rect.left + rect.width / 2, rect.top + rect.height / 2, 40);
      playHeartbeatSound();
    });

    function renderParticles() {
      ctx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.isBurst) {
          p.alpha *= 0.94;
          p.size *= 0.97;
          if (p.alpha < 0.02) {
            particles.splice(i, 1);
            continue;
          }
        } else {
          if (p.y < 0) p.y = height;
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
        }

        ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(renderParticles);
    }
    renderParticles();
  </script>
</body>
</html>
